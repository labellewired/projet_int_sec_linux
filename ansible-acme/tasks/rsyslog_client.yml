---
- name: Creer le repertoire de configuration rsyslog
  ansible.builtin.file:
    path: /etc/rsyslog.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurer l'expedition TCP vers infra
  ansible.builtin.template:
    src: rsyslog-client.conf.j2
    dest: /etc/rsyslog.d/90-acme-forward.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Valider rsyslog
  ansible.builtin.command: rsyslogd -N1
  changed_when: false

- name: Demarrer rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: started
    enabled: true
