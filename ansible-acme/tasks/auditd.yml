---
- name: Installer les regles auditd
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-acme.rules
    owner: root
    group: root
    mode: "0600"
  notify: Load audit rules

- name: Demarrer auditd sans le redemarrer
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
