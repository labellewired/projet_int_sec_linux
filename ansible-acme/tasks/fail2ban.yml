---
- name: Installer Fail2ban et le backend journal systemd
  ansible.builtin.dnf:
    name: [fail2ban-server, python3-systemd]
    state: present

- name: Deployer la jail SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Deployer l'action qui bannit dans la zone public
  ansible.builtin.template:
    src: fail2ban-acme-firewalld.conf.j2
    dest: /etc/fail2ban/action.d/acme-firewalld.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Verifier la configuration Fail2ban
  ansible.builtin.command: fail2ban-client -t
  changed_when: false

- name: Demarrer Fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
