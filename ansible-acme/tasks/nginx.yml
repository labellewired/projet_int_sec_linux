---
- name: Installer Nginx PHP-FPM et les outils TLS
  ansible.builtin.dnf:
    name: [nginx, php-fpm, php-mysqlnd, python3-cryptography]
    state: present

- name: Creer les repertoires du site et de sa configuration
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ web_root }}", group: nginx, mode: "0755"}
    - {path: "{{ web_root }}/admin", group: nginx, mode: "0755"}
    - {path: /etc/acme, group: nginx, mode: "0750"}
    - {path: /etc/nginx/conf.d, group: root, mode: "0755"}
    - {path: /etc/nginx/secrets, group: nginx, mode: "0750"}
    - {path: /etc/pki/tls/private, group: root, mode: "0700"}
    - {path: /etc/pki/tls/certs, group: root, mode: "0755"}

- name: Creer la cle TLS seulement sur le serveur web
  community.crypto.openssl_privatekey:
    path: /etc/pki/tls/private/acme-web.key
    type: RSA
    size: 3072
    owner: root
    group: root
    mode: "0600"

- name: Creer la demande de certificat avec les noms et les IP
  community.crypto.openssl_csr:
    path: /etc/pki/tls/acme-web.csr
    privatekey_path: /etc/pki/tls/private/acme-web.key
    common_name: "{{ web_server_name }}"
    subject_alt_name:
      - "DNS:{{ web_server_name }}"
      - "DNS:{{ hostname_fqdn }}"
      - "IP:{{ web_public_ip }}"
      - "IP:{{ web_admin_ip }}"
    owner: root
    group: root
    mode: "0644"

- name: Creer le certificat autosigne du laboratoire
  community.crypto.x509_certificate:
    path: /etc/pki/tls/certs/acme-web.crt
    privatekey_path: /etc/pki/tls/private/acme-web.key
    csr_path: /etc/pki/tls/acme-web.csr
    provider: selfsigned
    selfsigned_not_after: "+365d"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Installer le fichier d'authentification admin
  ansible.builtin.template:
    src: nginx-htpasswd.j2
    dest: /etc/nginx/secrets/admin.htpasswd
    owner: root
    group: nginx
    mode: "0640"
  no_log: true

- name: Installer les identifiants de l'application hors de la racine web
  ansible.builtin.template:
    src: web-config.json.j2
    dest: /etc/acme/web.json
    owner: root
    group: nginx
    mode: "0640"
  no_log: true

- name: Installer l'application PHP connectee a MariaDB
  ansible.builtin.template:
    src: index.php.j2
    dest: "{{ web_root }}/index.php"
    owner: root
    group: nginx
    mode: "0644"

- name: Installer la page admin
  ansible.builtin.copy:
    dest: "{{ web_root }}/admin/index.html"
    content: |
      <!doctype html>
      <html lang="fr"><meta charset="utf-8"><title>ACME Administration</title>
      <h1>Administration ACME</h1><p>Acces admin authentifie.</p></html>
    owner: root
    group: nginx
    mode: "0644"

- name: Retirer les configurations web fournies par defaut
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/php-fpm.d/www.conf, /etc/nginx/conf.d/default.conf]

- name: Configurer le pool PHP-FPM pour Nginx
  ansible.builtin.template:
    src: php-fpm-acme.conf.j2
    dest: /etc/php-fpm.d/acme.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart php-fpm

- name: Autoriser la connexion SELinux vers la base locale
  ansible.posix.seboolean:
    name: httpd_can_network_connect_db
    state: true
    persistent: true

- name: Definir le contexte des fichiers de l'application
  community.general.sefcontext:
    target: '/etc/acme(/.*)?'
    setype: httpd_sys_content_t
    state: present

- name: Restaurer les contextes SELinux du site
  ansible.builtin.command:
    argv: [restorecon, -Rv, "{{ web_root }}", /etc/acme, /etc/nginx, /etc/pki/tls]
  register: acme_web_labels
  changed_when: acme_web_labels.stdout | length > 0

- name: Installer le site HTTPS ACME
  ansible.builtin.template:
    src: nginx-acme.conf.j2
    dest: /etc/nginx/conf.d/acme.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Installer la configuration principale Nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nginx -t -c %s
  notify: Reload nginx

- name: Verifier PHP-FPM
  ansible.builtin.command: php-fpm -t
  changed_when: false

- name: Verifier Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Demarrer PHP-FPM puis Nginx
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [php-fpm, nginx]
