---
- name: Installer les outils de gestion des depots
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Lire les depots actives
  ansible.builtin.command: dnf -q repolist --enabled
  register: acme_enabled_repositories
  changed_when: false

- name: Activer CRB si necessaire
  ansible.builtin.command: dnf config-manager --set-enabled crb
  when: acme_enabled_repositories.stdout is not search('(?m)^crb\\s')

- name: Installer la configuration EPEL 10 officielle
  ansible.builtin.dnf:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
    state: present

- name: Installer les paquets communs
  ansible.builtin.dnf:
    name: "{{ installation_packages }}"
    state: present

- name: Demarrer SSH
  ansible.builtin.systemd_service:
    name: sshd
    state: started
    enabled: true
