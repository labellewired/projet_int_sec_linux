---
- name: Configurer la synchronisation exclusivement sur infra
  ansible.builtin.template:
    src: chrony-client.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd

- name: Demarrer Chrony sur les clients
  ansible.builtin.systemd_service:
    name: chronyd
    state: started
    enabled: true
