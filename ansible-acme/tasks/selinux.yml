---
- name: Maintenir SELinux enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Interdire le routage IPv4 entre les segments
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    sysctl_set: true
    reload: true
    state: present

- name: Interdire le routage IPv6 entre les segments
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "0"
    sysctl_set: true
    reload: true
    state: present
