---
- name: Creer le repertoire des zones firewalld
  ansible.builtin.file:
    path: /etc/firewalld/zones
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deployer les zones selon le role du serveur
  ansible.builtin.template:
    src: "{{ item }}.xml.j2"
    dest: "/etc/firewalld/zones/{{ item }}.xml"
    owner: root
    group: root
    mode: "0644"
  loop: [public, admin]
  notify: Reload firewalld

- name: Demarrer firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Charger les zones avant de poursuivre
  ansible.builtin.meta: flush_handlers

- name: Lire la zone par defaut
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: acme_default_zone
  changed_when: false

- name: Definir drop comme zone par defaut
  ansible.builtin.command: firewall-cmd --set-default-zone=drop
  when: acme_default_zone.stdout | trim != 'drop'
