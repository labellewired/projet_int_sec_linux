---
- name: Creer le repertoire des configurations SSH
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inclure les fichiers de durcissement
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config.d/\\*.conf$'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Deployer le durcissement et le MFA public du bastion
  ansible.builtin.template:
    src: sshd-acme.conf.j2
    dest: /etc/ssh/sshd_config.d/00-acme.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reload sshd

- name: Valider la configuration SSH complete
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Maintenir SSH actif
  ansible.builtin.systemd_service:
    name: sshd
    state: started
    enabled: true
