---
- name: Creer les deux comptes avec sudo
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    groups: wheel
    append: true
    create_home: true
    update_password: on_create
    password: "{{ vault_linux_password_hashes[item.name] }}"
    state: present
  loop: "{{ acme_users }}"
  no_log: true

- name: Installer les cles publiques ed25519 autorisees
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.authorized_keys | join('\n') }}"
    exclusive: true
    manage_dir: true
    state: present
  loop: "{{ acme_users }}"
  loop_control:
    label: "{{ item.name }}"
