---
- name: Creer les repertoires de journald
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/systemd/journald.conf.d, group: root, mode: "0755"}
    - {path: /var/log/journal, group: systemd-journal, mode: "2755"}

- name: Activer les journaux persistants
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-acme.conf
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=256M
      RuntimeMaxUse=64M
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
