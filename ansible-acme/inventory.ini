# Executer depuis le bastion avec le compte zlizotte.
[bastion]
bastion.acme.lan ansible_connection=local

[web]
web.acme.lan ansible_host=10.10.10.20

[infra]
infra.acme.lan ansible_host=10.10.10.40

[servers:children]
bastion
web
infra

[servers:vars]
ansible_user=zlizotte
ansible_python_interpreter=/usr/bin/python3
# Cle privee presente seulement sur le bastion.
ansible_ssh_private_key_file=/home/zlizotte/.ssh/id_ed25519
