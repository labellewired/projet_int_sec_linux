---
# ============================================================
# ACME - Common configuration
# Applied to all servers
# ============================================================

# ------------------------------------------------------------
# Hostname
# ------------------------------------------------------------

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ acme_hostname }}"

# ------------------------------------------------------------
# Essential packages
# ------------------------------------------------------------

- name: Install common packages
  ansible.builtin.dnf:
    name:
      - sudo
      - firewalld
      - chrony
      - rsyslog
      - policycoreutils
      - python3-libselinux
    state: present

# ------------------------------------------------------------
# Users
# ------------------------------------------------------------

- name: Create ACME users
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
    create_home: true
    shell: /bin/bash
    groups: wheel
    append: true
  loop: "{{ acme_users }}"
  no_log: true

# ------------------------------------------------------------
# SELinux
# ------------------------------------------------------------

- name: Set SELinux to enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

# ------------------------------------------------------------
# Persistent systemd journal
# ------------------------------------------------------------

- name: Create persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Restart systemd-journald

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent systemd journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-acme.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
  notify: Restart systemd-journald

# ------------------------------------------------------------
# Sudo logging
# ------------------------------------------------------------

- name: Configure sudo logging
  ansible.builtin.copy:
    dest: /etc/sudoers.d/acme-logging
    owner: root
    group: root
    mode: "0440"
    content: |
      Defaults logfile="/var/log/sudo.log"
    validate: '/usr/sbin/visudo -cf %s'

# ------------------------------------------------------------
# Services
# ------------------------------------------------------------

- name: Enable common services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - firewalld
    - chronyd
    - rsyslog
