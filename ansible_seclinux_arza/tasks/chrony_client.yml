---
# ============================================================
# ACME - Chrony client configuration
# Applied to Bastion and Web
# ============================================================

- name: Configure Chrony to use infrastructure server
  ansible.builtin.copy:
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      server {{ ntp_server }} iburst

      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync
  notify: Restart chronyd

- name: Ensure Chrony is enabled and running
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
