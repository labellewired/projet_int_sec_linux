---

# NFS server configuration

- name: Install NFS server packages
  ansible.builtin.dnf:
    name:
      - nfs-utils
    state: present

# Ensure shared directory exists

- name: Create NFS shared directory
  ansible.builtin.file:
    path: "{{ nfs_share_path }}"
    state: directory
    owner: nobody
    group: nobody
    mode: "0777"

# Deploy exports file

- name: Configure NFS exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: 
    - Restart nfs
    - Reload NFS exports

# Enable and start NFS services

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true
  

# Firewall configuration

- name: Allow NFS through firewall
  ansible.posix.firewalld:
    service: nfs
    permanent: true
    immediate: true
    state: enabled

- name: Allow RPC mountd
  ansible.posix.firewalld:
    service: mountd
    permanent: true
    immediate: true
    state: enabled

- name: Allow RPC lockd
  ansible.posix.firewalld:
    service: rpc-bind
    permanent: true
    immediate: true
    state: enabled