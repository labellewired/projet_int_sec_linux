---

# DNS / BIND server configuration

- name: Install BIND and DNS tools (bind-utils)
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
    state: present

# Named main configuration

- name: Deploy named.conf configuration 
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
  notify: Restart named

# Zone forward: fabhoule.ca

- name: Deploy forward DNS zone
  ansible.builtin.template:
    src: db.fabhoule.ca.j2
    dest: "/var/named/db.{{ domain_name }}"
    owner: root
    group: named
    mode: "0640"
  notify: Restart named

# Zone reverse: 172.16.200.0/24

- name: Deploy reverse DNS zone
  ansible.builtin.template:
    src: db.reverse.j2
    dest: "/var/named/db.{{ reverse_zone_file }}"
    owner: root
    group: named
    mode: "0640"
  notify: Restart named

# Service management

- name: Activate and start named
  ansible.builtin.service:
    name: named
    state: started
    enabled: true

# Firewall configuration

- name: Authorize DNS through firewalld
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled