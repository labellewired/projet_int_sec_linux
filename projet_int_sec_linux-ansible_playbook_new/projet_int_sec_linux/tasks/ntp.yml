---

# NTP/CHRONY SERVER CONFIGURATION

- name: Install chrony (NTP server)
  ansible.builtin.dnf:
    name: chrony
    state: present

# Configuration file

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd

# Service management

- name: Activate and start chronyd
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

# Firewall configuration

- name: Authorize NTP through firewalld
  ansible.posix.firewalld:
    service: ntp
    permanent: true
    immediate: true
    state: enabled